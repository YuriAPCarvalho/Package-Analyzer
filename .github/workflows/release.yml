name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    if: github.repository == 'YuriAPCarvalho/Package-Analyzer'

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 9.0.x

      - name: Read version and release notes
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Tag '$tag' must use SemVer format like v0.1.0."
          }

          $version = $Matches.version
          $assemblyVersion = "$version.0"
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
          $escapedVersion = [regex]::Escape($version)
          $match = [regex]::Match($changelog, "(?ms)^## \[$escapedVersion\].*?(?=^## \[|\z)")
          if (-not $match.Success) {
            throw "CHANGELOG.md must contain a '## [$version]' section."
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $metadata = @"

          ## Release provenance

          - Source repository: https://github.com/YuriAPCarvalho/Package-Analyzer
          - Tag: $tag
          - Commit: ${{ github.sha }}
          - Workflow: ${{ github.workflow }}
          - License: MIT
          - Privacy policy: https://github.com/YuriAPCarvalho/Package-Analyzer/blob/$tag/PRIVACY.md
          - Code signing policy: https://github.com/YuriAPCarvalho/Package-Analyzer/blob/$tag/CODE_SIGNING_POLICY.md
          - SignPath Foundation integration: planned / application pending.
          - Signature status: unsigned release artifacts.
          - Checksums: see SHA256SUMS.txt attached to this release.

          ## Security notice

          The application is not digitally signed yet. Windows SmartScreen may show a warning during installation or first launch. Download Package-Analyzer only from this official GitHub release and verify the SHA-256 checksum published with the installer.
          "@
          Set-Content -LiteralPath $notesPath -Value ($match.Value.Trim() + $metadata) -Encoding utf8
          "version=$version" >> $env:GITHUB_OUTPUT
          "assembly_version=$assemblyVersion" >> $env:GITHUB_OUTPUT
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore TrivyProjectManager.sln -m:1 -nr:false

      - name: Build
        run: dotnet build TrivyProjectManager.sln --configuration Release --no-restore -m:1 -nr:false -p:Version=${{ steps.version.outputs.version }} -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} -p:FileVersion=${{ steps.version.outputs.assembly_version }} -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test TrivyProjectManager.sln --configuration Release --no-build -m:1 -nr:false

      - name: Publish Windows x64
        run: dotnet publish src\TrivyProjectManager.App\TrivyProjectManager.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts\publish\win-x64 -p:Version=${{ steps.version.outputs.version }} -p:AssemblyVersion=${{ steps.version.outputs.assembly_version }} -p:FileVersion=${{ steps.version.outputs.assembly_version }} -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Download previous Velopack release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: vpk download github --repoUrl https://github.com/YuriAPCarvalho/Package-Analyzer --token $env:GITHUB_TOKEN --channel stable --outputDir Releases

      - name: Mark pack start
        id: pack_start
        shell: pwsh
        run: |
          $ticks = [DateTimeOffset]::UtcNow.AddSeconds(-5).Ticks
          "ticks=$ticks" >> $env:GITHUB_OUTPUT

      - name: Pack Velopack release
        run: |
          vpk pack `
            --packId YuriAPCarvalho.PackageAnalyzer `
            --packTitle "Package-Analyzer" `
            --packVersion ${{ steps.version.outputs.version }} `
            --packDir artifacts\publish\win-x64 `
            --mainExe Package-Analyzer.exe `
            --channel stable `
            --runtime win-x64 `
            --outputDir Releases `
            --icon src\TrivyProjectManager.App\Assets\app-icon.ico `
            --splashImage src\TrivyProjectManager.App\Assets\app-logo.png `
            --splashProgressColor "#20C997" `
            --shortcuts "Desktop,StartMenuRoot" `
            --releaseNotes "${{ steps.version.outputs.notes_path }}"
          # Future SignPath Foundation hook:
          # add signing only after approval, with CI-origin verification and manual signing approval.

      - name: Prepare release assets
        shell: pwsh
        run: |
          $cutoff = [DateTimeOffset]::new([long]"${{ steps.pack_start.outputs.ticks }}", [TimeSpan]::Zero).UtcDateTime
          $assetDirectory = New-Item -ItemType Directory -Force -Path artifacts\release-assets
          $files = Get-ChildItem -LiteralPath Releases -File | Where-Object {
            $_.LastWriteTimeUtc -ge $cutoff -or $_.Name -like "RELEASES*"
          } | Sort-Object Name
          if ($files.Count -eq 0) {
            throw "No Velopack release artifacts were generated."
          }

          foreach ($file in $files) {
            Copy-Item -LiteralPath $file.FullName -Destination $assetDirectory.FullName -Force
          }

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath artifacts\release-assets -File | Sort-Object Name
          $checksums = foreach ($file in $files) {
            $hash = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($file.Name)"
          }
          Set-Content -LiteralPath artifacts\release-assets\SHA256SUMS.txt -Value $checksums -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.version }}"
          $notesPath = "${{ steps.version.outputs.notes_path }}"
          $assets = Get-ChildItem -LiteralPath artifacts\release-assets -File | Sort-Object Name | Select-Object -ExpandProperty FullName
          gh release create $tag @assets `
            --repo $env:GITHUB_REPOSITORY `
            --title "Package-Analyzer $version" `
            --notes-file $notesPath `
            --verify-tag `
            --latest
