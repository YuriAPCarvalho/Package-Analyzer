name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 9.0.x

      - name: Validate GitHub Actions workflows
        shell: pwsh
        run: |
          $version = "1.7.12"
          $archiveName = "actionlint_${version}_windows_amd64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $toolDirectory = Join-Path $env:RUNNER_TEMP "actionlint"
          $downloadUrl = "https://github.com/rhysd/actionlint/releases/download/v$version/$archiveName"
          $expectedHash = "6e7241b51e6817ea6a047693d8e6fed13b31819c9a0dd6c5a726e1592d22f6e9"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
          $actualHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "Unexpected SHA-256 for $archiveName. Expected $expectedHash, got $actualHash."
          }

          Expand-Archive -LiteralPath $archivePath -DestinationPath $toolDirectory
          & (Join-Path $toolDirectory "actionlint.exe")

      - name: Restore
        run: dotnet restore TrivyProjectManager.sln -m:1 -nr:false

      - name: Build
        run: dotnet build TrivyProjectManager.sln --configuration Release --no-restore -m:1 -nr:false

      - name: Test
        run: dotnet test TrivyProjectManager.sln --configuration Release --no-build -m:1 -nr:false
